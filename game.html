<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="game.css">
    <script src="game.js" defer></script>
</head>
<body>

    <h1>Rock, Paper, Scissors</h1>
    <p>Select your move to play against the computer:</p>

    <div class="score-board">
        <div class="score">You: <span id="user-score">0</span></div>
        <div class="score">Computer: <span id="comp-score">0</span></div>
    </div>

    <div class="choices">
        <button class="btn" id="rock-btn">✊ Rock</button>
        <button class="btn" id="paper-btn">✋ Paper</button>
        <button class="btn" id="scissors-btn">✌️ Scissors</button>
    </div>

    <div class="result-div" id="result-msg">Start the game!</div>
    <div class="choices-made" id="choices-msg"></div>

</body>
</html>
