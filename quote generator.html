<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quote Generator</title>

    <link rel="stylesheet" href="quote generator.css">
    <script src="quote generator.js" defer></script>
</head>

<body>

    <header>
        <h1>Quote Generator App</h1>
        <p>This app gives you a new quote every time you click the button 😉</p>
    </header>

    <section class="page">

        <div class="quote" id="result">
            Click the button to generate a quote.
        </div> 
        <button id="click" onclick="quoteGenerator()">
            Click Me
        </button>

    </section>

</body>
</html>
