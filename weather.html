<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Online</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>My Weather App</h1>
    </header>

    <section class="main">
        <p>Check Weather of your city anytime😁</p>
        <div class="info">
            <button onclick="showWeather('karachi')">Karachi</button>
            <button onclick="showWeather('lahore')">Lahore</button>
            <button onclick="showWeather('islamabad')">Islamabad</button>
            <button onclick="showWeather('quetta')">Quetta</button>
            <button onclick="showWeather('peshawar')">Peshawar</button>
        </div>
    </section> 

    <section class="display">
        <p id="icon"></p>
        <h2 id="city-name">Select a City</h2>
        <p id="temperature" class="temperature"></p>
        <p id="condition" class="condition"></p>
    </section>
    
    <script src="script.js"></script>
</body>
</html>
