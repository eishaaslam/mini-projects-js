<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counting script</title>
    <link rel="stylesheet" href="counting.css">
    <script src="counting.js" defer></script>
</head>
<body>
    <header>
        <h1>Count your Characters😊</h1>
    </header>
    <section class="input">
        <div class="intro"></div>
        <p>This site helps you to count the exact number of Characters of your script.Feel free to check it online😀.</p>
        
        <div class="script">
            <textarea id="textBox" placeholder="Type or paste your text here..."></textarea>
            <br>
            <button class="enter" id="button">Count Characters</button>
        </div>

        <p id="result"></p>
    </section>
</body>
</html>
